    /* Every task is calibrated to DOK 3 (strategic thinking: argue, cite evidence,
       evaluate) or DOK 4 (extended synthesis across sources/eras). Choice varies
       modality, not rigor. */
    const USH_DOMAINS = [
      {
        id: "domain-1",
        title: "1. Colonial Foundations & Governance",
        standards: "SSUSH1 - SSUSH2",
        description: "Investigate early English settlement, mercantilism, regional differences, and the emergence of early self-governance and colonial identity.",
        cards: [
          { id: "1-1", title: "The Great Colony Pitch", type: "Creative Media", scenario: "You are a 17th-century land promoter hired by a joint-stock company. To attract diverse settlers, you must highlight your chosen region's geography, economic promise, and community structure.", modality: "Video Pitch or Illustrated Brochure", deliverable: "Pitch ONE region (Southern, New England, or Mid-Atlantic). Go past describing geography: argue why that region's specific geography and economy made it more likely than the other two to attract AND retain your target settlers. Support with three concrete geographic or economic factors, and name one hardship a realistic settler would weigh against your pitch.", standard: "SSUSH1b, c, d", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-2", title: "The Mercantilism Audit", type: "Analytical / Data", scenario: "You are a Crown Auditor sent from London in 1690. You need to analyze the flow of raw materials and manufactured goods to ensure the Empire's balance of trade is favored.", modality: "Infographic / Trade Flowchart", deliverable: "Build an annotated trans-Atlantic trade flowchart, then use it to argue whether mercantilism was primarily colonial exploitation or mutual benefit. Trace three specific raw-material-to-finished-good cycles, cite two enforcement mechanisms (e.g., Navigation Acts), and close with an evidence-based judgment.", standard: "SSUSH1a", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "1-3", title: "Coexistence & Conflict", type: "Empathetic Writing", scenario: "You are a neutral scribe documenting the interactions between early English colonists and local American Indian tribes (e.g., Powhatan in Virginia or Wampanoag in New England).", modality: "Dual-Perspective Journal Entries", deliverable: "Write 3 paired journal entries (Indigenous leader + English settler). Each pair must isolate one point of conflict (land ownership, resource use, or an agreement) and show how two worldviews drew different but internally logical conclusions from the same event. End with a note arguing which misunderstanding was most consequential and why.", standard: "SSUSH1b, c", dok: "DOK 3", difficulty: "Hard" },
          { id: "1-4", title: "The Salutary Neglect Charter", type: "Civics / Law", scenario: "Your colony has operated under the British policy of 'Salutary Neglect' for decades. You and your fellow assembly members must formalize your town's self-governance system.", modality: "Draft Town Charter & Bylaws", deliverable: "Draft a charter modeled on the Mayflower Compact or House of Burgesses. Beyond listing rules, defend three core provisions (who votes, how laws pass, how disputes settle) by explaining the colonial condition or English precedent each answers. Then predict one way this self-governance habit later collides with direct royal control.", standard: "SSUSH2c", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-5", title: "Voices of the Great Awakening", type: "Performance / Audio", scenario: "You are an investigative reporter in 1740. You are attending an outdoor sermon by a fiery New Light preacher (like Jonathan Edwards or George Whitefield).", modality: "Podcast Episode or Live Report", deliverable: "Record a 3-minute broadcast or eyewitness column that argues, not just describes: show how the revival's message and delivery (itinerant preaching, emotional appeal, challenge to settled clergy) worked to weaken traditional authority and build inter-colonial connection. Cite one specific rhetorical move and explain its social effect.", standard: "SSUSH2d", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-6", title: "Culinary History & Foodways", type: "Hands-on Culture", scenario: "You are a modern culinary anthropologist curating an exhibit on West African contributions to Southern foodways, agriculture, and culture brought over during the Middle Passage.", modality: "Interactive Recipe Book & History", deliverable: "Curate 3 ingredients/dishes of West African origin. For each, trace the path from West Africa through the Middle Passage into Southern agriculture, and argue how enslaved Africans' knowledge (not only their labor) shaped the colonial economy. Rank the three by lasting cultural impact and defend the ranking with specific evidence.", standard: "SSUSH2b", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-7", title: "The Diversity Tapestry", type: "Design / Curation", scenario: "You are a museum curator designing an interactive mural that celebrates European cultural diversity (German, Scottish, Irish, Dutch) in the early colonies.", modality: "Visual Collage & Museum Plaque", deliverable: "Design a mural featuring three non-English European groups. Rather than cataloguing contributions, build an argument: explain how Mid-Atlantic religious and ethnic pluralism produced governance and economic patterns distinct from New England or the South. Cite one contribution per group and tie it to that regional difference.", standard: "SSUSH2a", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-8", title: "The Middle Passage Memorial", type: "Public Commem.", scenario: "You are a landscape architect commissioned to design a public memorial site in Savannah or Charleston to honor the memory and resilience of the millions of Africans who survived the Middle Passage.", modality: "Architectural Blueprint & Artist Statement", deliverable: "Design a memorial with a 300-word justification. Tie each major feature by explicit argument to a documented aspect of the Middle Passage or enslaved life (mortality, resistance, cultural retention). Explain one design choice you rejected and why, showing how you weighed representing trauma responsibly.", standard: "SSUSH2b", dok: "DOK 3", difficulty: "Medium" },
          { id: "1-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "You have a unique proposal to show your understanding of Colonial foundations, mercantilism, or cultural integration.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal below. To be approved it must hit DOK 3 or higher: the deliverable has to require analysis, argument, or evaluation backed by specific historical evidence, not description or recall. Name the standard and the DOK level you are targeting.", standard: "SSUSH1 - SSUSH2", dok: "DOK 3+", difficulty: "Flexible" }
        ]

      {
        id: "domain-2",
        title: "2. Revolution & The Constitution",
        standards: "SSUSH3 - SSUSH5",
        description: "Analyze the ideological causes of the American Revolution, key wartime dynamics, and the intense debates that shaped the U.S. Constitution.",
        cards: [
          { id: "2-1", title: "The Propaganda Press", type: "Creative Media", scenario: "You are an underground Patriot printer in Boston in 1774. You want to rally colonist support against British taxation and administrative acts.", modality: "Revolutionary Broadside / Newspaper", deliverable: "Produce a broadside targeting ONE act (Proclamation of 1763, Stamp Act, or Intolerable Acts). Beyond persuasion, correctly represent the specific constitutional grievance ('no taxation without representation,' rights as Englishmen) and show how the Sons/Daughters of Liberty turned that grievance into action. Annotate two persuasive techniques and explain why each would move a hesitant colonist.", standard: "SSUSH3b", dok: "DOK 3", difficulty: "Medium" },
          { id: "2-2", title: "The Common Sense Edit", type: "Analytical Writing", scenario: "You are an assistant to Thomas Paine in January 1776. He asks you to help craft the introductory pamphlet that will convince ordinary colonists to choose absolute independence over reconciliation.", modality: "Modern Executive Summary & Call to Action", deliverable: "Translate Paine into a modern manifesto or thread. Reconstruct his actual argument: identify two core claims (against hereditary monarchy; that reconciliation is impractical), render each in modern language, then evaluate which would still persuade a skeptical 1776 colonist and which would fail. Defend your evaluation.", standard: "SSUSH3c", dok: "DOK 3", difficulty: "Medium" },
          { id: "2-3", title: "Diplomatic Cable from Paris", type: "Civics / Law", scenario: "You are Benjamin Franklin's diplomatic attaché in Paris, 1778. You have just secured the vital French Alliance following the Battle of Saratoga.", modality: "Secret Diplomatic Dispatch", deliverable: "Write an encoded dispatch explaining how Saratoga unlocked the French alliance. Argue the causal chain: why a battlefield outcome changed French calculation, what specific aid resulted, and how it shifted the war's strategic balance. Then weigh whether the alliance was decisive or merely an accelerant, and defend the call.", standard: "SSUSH4b", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "2-4", title: "The Military Turning Point Map", type: "Design / Curation", scenario: "You are George Washington's Chief Cartographer. You need to brief newly arrived officers like Von Steuben and Lafayette on how geography impacted key battles.", modality: "Tactical Battle Map Analysis", deliverable: "Analyze Trenton, Saratoga, or Yorktown. Your map must argue, not just illustrate: show how one geographic feature (river crossing, high ground, coastal blockade) created the tactical advantage, then explain how the outcome would plausibly differ if that feature were absent. Cite troop movements or commanders as evidence.", standard: "SSUSH4d", dok: "DOK 3", difficulty: "Medium" },
          { id: "2-5", title: "The Valley Forge Podcast", type: "Performance / Audio", scenario: "You are a soldier or camp follower at Valley Forge during the bitter winter of 1777-1778. You want to record the transformation of this struggling militia into a professional fighting force.", modality: "Audio Diary Series", deliverable: "Record a 3-minute audio diary that argues a claim: Valley Forge was a turning point in professionalizing the Continental Army. Use specific evidence (von Steuben's drill system, supply conditions, morale) and explain the mechanism by which hardship plus training produced a more effective force.", standard: "SSUSH4c", dok: "DOK 3", difficulty: "Medium" },
          { id: "2-6", title: "Unsung Heroes of '76", type: "Public Commem.", scenario: "You are a historian writing a feature article on how the Revolutionary War was not fought solely by white men in continental uniforms.", modality: "Biographical Profile Series", deliverable: "Create three profiles (a woman, an American Indian, and an enslaved/free Black participant). For each, go past biography: argue how that contribution complicates the standard 'Founding Fathers' narrative, and cite the specific action taken. Close by evaluating whose contribution is most underrepresented in common memory and why.", standard: "SSUSH4e", dok: "DOK 3", difficulty: "Medium" },
          { id: "2-7", title: "The Constitution Compromise Debate", type: "Empathetic Writing", scenario: "You are a delegate at the Constitutional Convention in 1787. The convention is at a breaking point over representation and state sovereignty.", modality: "Fictional Dialogue / Play Script", deliverable: "Script a debate between a small-state and large-state delegate that accurately represents both the Great Compromise and the Three-Fifths Compromise. Each delegate must argue from genuine interest (representation, power, economy), and the script must show the trade-off that produced agreement. End with your evaluation of which compromise created the more lasting structural problem.", standard: "SSUSH5c", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "2-8", title: "The Federalist Paper Debate", type: "Civics / Law", scenario: "You are an undecided citizen in New York in 1788. You are reading Alexander Hamilton's Federalist papers in one hand, and Anti-Federalist critiques in the other.", modality: "Point-Counterpoint Editorial", deliverable: "Write a point-counterpoint editorial. Represent the Federalist case for a strong central government and the Anti-Federalist demand for a Bill of Rights, each with a specific argument (energy in the executive vs. protection from tyranny). Then take a position: which side's fear proved more justified by later history? Defend it with at least one post-ratification example.", standard: "SSUSH5d, e", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "2-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Propose a custom project covering the transition from the Articles of Confederation to the Constitution.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal. It must hit DOK 3 or higher: analysis, argument, or evaluation with specific evidence, not description. Name the standard and the DOK level you are targeting.", standard: "SSUSH3 - SSUSH5", dok: "DOK 3+", difficulty: "Flexible" }
        ]
      },
      {
        id: "domain-3",
        title: "3. Early Republic & Westward Expansion",
        standards: "SSUSH6 - SSUSH8",
        description: "Examine the presidencies of Washington through Monroe, the rise of Jacksonian democracy, social reform movements, and how expansion deepened sectional divisions.",
        cards: [
          { id: "3-1", title: "The Presidential Briefing", type: "Analytical Writing", scenario: "You are a senior advisor to one of the first five Presidents (Washington, Adams, Jefferson, Madison, or Monroe). You must prepare a 'crisis briefing' on a defining challenge of their administration.", modality: "Executive Memo to the President", deliverable: "Write a 400-word crisis memo. Frame a real decision (e.g., Louisiana Purchase constitutionality, Sedition Act, Election of 1800), lay out two options with their consequences, and recommend one with justification tied to the president's principles and constraints.", standard: "SSUSH6b, c", dok: "DOK 3", difficulty: "Hard" },
          { id: "3-2", title: "The Monroe Doctrine Banner", type: "Creative Media", scenario: "You are a political cartoonist in 1823. President Monroe has just declared the Western Hemisphere closed to future European colonization.", modality: "Editorial Cartoon & Editorial", deliverable: "Design a political cartoon plus analysis. The cartoon must take a clear stance, and your paragraph must argue how a doctrine the U.S. lacked the naval power to enforce still reshaped hemispheric policy for a century. Cite one later application or misuse as evidence.", standard: "SSUSH6e", dok: "DOK 3", difficulty: "Medium" },
          { id: "3-3", title: "Clay's American System Map", type: "Design / Curation", scenario: "You are an economic planner in Henry Clay's office. You need to convince Western farmers, Northern factory owners, and Southern planters that they are all interconnected.", modality: "Economic Connectivity Map & Pitch", deliverable: "Map the American System, then argue whether it truly served all three regions or advantaged some over others. Show how tariffs, the Bank, and internal improvements were meant to interlock, and use sectional interest to explain why the South ultimately resisted. Support the judgment.", standard: "SSUSH7b", dok: "DOK 3", difficulty: "Medium" },
          { id: "3-4", title: "Jacksonian Democracy Town Hall", type: "Performance / Audio", scenario: "The year is 1832. You are hosting a town hall meeting discussing Andrew Jackson's presidency—including the expansion of white male suffrage, the Nullification Crisis, and the Indian Removal Act.", modality: "Town Hall Roleplay Recording / Script", deliverable: "Script or record three voices (Jackson supporter, SC planter, Cherokee representative) on suffrage expansion, nullification, and Indian Removal. Each must reason from material interest, and the piece must surface the core contradiction of 'Jacksonian democracy': expanding rights for some while stripping them from others. Close with an evaluative narrator note.", standard: "SSUSH7a", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "3-5", title: "The Reform Crusade Newspaper", type: "Creative Media", scenario: "You are an activist in upstate New York in 1848, swept up in the religious zeal of the Second Great Awakening. You are organizing a reform movement.", modality: "Social Reform Newsletter", deliverable: "Design a 2-page reform newsletter (Temperance, Public Education, or Women's Suffrage). Beyond advocacy, connect the movement to the Second Great Awakening's belief in human perfectibility, and argue why this reform gained traction in this era specifically. Include one opponent's counterargument and rebut it.", standard: "SSUSH7c", dok: "DOK 3", difficulty: "Medium" },
          { id: "3-6", title: "The Abolitionist Press", type: "Empathetic Writing", scenario: "You are writing for an abolitionist newspaper like William Lloyd Garrison's The Liberator or Frederick Douglass's The North Star.", modality: "Abolitionist Op-Ed or Call to Action", deliverable: "Write a persuasive abolitionist article in the voice of Garrison's or Douglass's paper. Build a moral and constitutional argument against slavery's expansion, reference a specific event (e.g., Nat Turner), and analyze how it sharpened both abolitionist urgency and Southern reaction. Anticipate the pro-slavery response.", standard: "SSUSH7d", dok: "DOK 3", difficulty: "Medium" },
          { id: "3-7", title: "The Sectionalism Balance Scale", type: "Analytical / Data", scenario: "You are a congressional clerk in 1850. Every time a new territory seeks statehood, the delicate balance between free and slave states is threatened.", modality: "Interactive Timeline & Balance Sheet", deliverable: "Build a timeline/balance sheet of the Missouri Compromise, Texas annexation, and Compromise of 1850. Argue a thesis: each 'compromise' postponed rather than resolved the crisis. Explain the mechanism by which each one seeded the next conflict, supported by the free/slave-state math.", standard: "SSUSH8a, d", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "3-8", title: "The Road to Harper's Ferry", type: "Design / Curation", scenario: "The year is 1860. You are a national reporter creating a special report on the events that have made Civil War feel completely inevitable.", modality: "Illustrated Concept Map of Escalation", deliverable: "Build a concept map linking the Kansas-Nebraska Act, Bleeding Kansas, Dred Scott, John Brown's Raid, and the Election of 1860. Do not just sequence them: argue the causal relationships (which events radicalized which side) and identify the single point after which you believe war became unavoidable. Defend that choice.", standard: "SSUSH8e", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "3-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Propose your own medium to analyze the Age of Jackson, social reform movements, or Manifest Destiny.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal. It must hit DOK 3 or higher: analysis, argument, or evaluation with specific evidence, not description. Name the standard and the DOK level you are targeting.", standard: "SSUSH6 - SSUSH8", dok: "DOK 3+", difficulty: "Flexible" }
        ]
      },
      {
        id: "domain-4",
        title: "4. Civil War & Reconstruction",
        standards: "SSUSH9 - SSUSH10",
        description: "Analyze the economic disparities, key leadership, major battles, and the complex social and constitutional struggles of the Reconstruction Era.",
        cards: [
          { id: "4-1", title: "The War of Resources", type: "Analytical / Data", scenario: "You are a war correspondent in 1861. You want to show your readers why the North and South are economically mismatched using hard data.", modality: "Comparative Infographic", deliverable: "Build a Union vs. Confederate resource infographic, then use the data to argue how those disparities shaped each side's strategy (Anaconda Plan, war of attrition, Southern reliance on quick victory and foreign recognition). Explain why superior resources did NOT guarantee a fast Union win.", standard: "SSUSH9a", dok: "DOK 3", difficulty: "Medium" },
          { id: "4-2", title: "Analyzing Lincoln's Pen", type: "Analytical Writing", scenario: "You are a political analyst in 1865 evaluating Abraham Lincoln's use of executive and rhetorical power to preserve the Union.", modality: "Critical Literary & Historical Analysis", deliverable: "Write an essay analyzing how Lincoln used the suspension of habeas corpus, the Emancipation Proclamation, and the Gettysburg Address to redefine the war's purpose. Argue whether his expansion of executive power was justified by wartime necessity, supported by specific language or context from at least two of the three.", standard: "SSUSH9b", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "4-3", title: "The Battle & Geography Log", type: "Design / Curation", scenario: "You are a military strategist documenting how terrain and waterways shaped the major engagements of the Civil War.", modality: "Tactical Geography Journal", deliverable: "Analyze how geography shaped Fort Sumter, Antietam, Vicksburg, Gettysburg, and Atlanta. For each, argue the specific way terrain or waterways affected the outcome, then rank the two most strategically decisive and justify the ranking.", standard: "SSUSH9d", dok: "DOK 3", difficulty: "Medium" },
          { id: "4-4", title: "The Leaders' Debate", type: "Performance / Audio", scenario: "You are a military historian creating a hypothetical round-table discussion between Union and Confederate leaders.", modality: "Podcast or Scripted Conversation", deliverable: "Script a roundtable among Grant, Lee, Jackson, and Sherman. Each must articulate a distinct military philosophy (total war, defensive maneuver, and so on) grounded in a real campaign, and the piece must argue how the clash of philosophies determined key turning points. Close by evaluating whose approach best fit his side's strategic situation.", standard: "SSUSH9c", dok: "DOK 3", difficulty: "Hard" },
          { id: "4-5", title: "Clash of Reconstructions", type: "Civics / Law", scenario: "You are a member of Congress in 1867. You are caught in the fierce battle between President Andrew Johnson's lenient plans and the Radical Republicans' strict congressional demands.", modality: "Point-Counterpoint Legislative Briefing", deliverable: "Build a comparative chart or debate script contrasting Presidential and Congressional Reconstruction. Argue how Lincoln's assassination and Johnson's clashes with the Radicals shifted control of Reconstruction, and evaluate which approach had a better chance of securing Black civil rights, with evidence.", standard: "SSUSH10a", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "4-6", title: "The Freedmen's Bureau Report", type: "Empathetic Writing", scenario: "You are a field agent for the Freedmen's Bureau in Georgia, 1866. You are documenting your attempts to assist former slaves and poor whites.", modality: "First-Person Field Report", deliverable: "Write a 3-part field diary as a Bureau agent. Beyond documenting relief, analyze the structural obstacles (labor contracts that echoed old dependencies, white resistance, limited funding) and argue whether the Bureau's design set it up to succeed or fail. Cite specific tasks as evidence.", standard: "SSUSH10b, d", dok: "DOK 3", difficulty: "Medium" },
          { id: "4-7", title: "The Reconstruction Amendments", type: "Creative Media", scenario: "You are an educator in 1870. You need to explain the game-changing nature of the 13th, 14th, and 15th Amendments to newly freed citizens who want to understand their civil rights.", modality: "Civic Rights Explainer Guide", deliverable: "Create a plain-language guide to the 13th, 14th, and 15th Amendments. Go past definitions: for each, argue what specific gap it closed AND what loophole or weakness later let Jim Crow survive it (13th's exception clause, weak 15th enforcement). Rank which amendment proved most consequential long-term.", standard: "SSUSH10c", dok: "DOK 3", difficulty: "Medium" },
          { id: "4-8", title: "The Compromise of 1877", type: "Analytical Writing", scenario: "You are a political journalist in Washington, D.C. reporting on the backroom deal that resolved the disputed Presidential Election of 1876.", modality: "Investigative Exposé Article", deliverable: "Write an exposé on the disputed 1876 election and the deal that ended Reconstruction. Argue how the withdrawal of federal troops directly enabled the rise of Jim Crow, and evaluate whether the compromise was a reasonable political settlement or a betrayal of Black Southerners. Support with specifics.", standard: "SSUSH10e", dok: "DOK 3", difficulty: "Medium" },
          { id: "4-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Design your own creative project demonstrating your understanding of the Civil War or the Reconstruction era.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal. It must hit DOK 3 or higher: analysis, argument, or evaluation with specific evidence, not description. Name the standard and the DOK level you are targeting.", standard: "SSUSH9 - SSUSH10", dok: "DOK 3+", difficulty: "Flexible" }
        ]
      },
      {
        id: "domain-5",
        title: "5. Industrialization, Labor & Reform",
        standards: "SSUSH11 - SSUSH13",
        description: "Explore the rise of Big Business, transcontinental infrastructure, massive immigration, the struggle of labor unions, and Progressive reform efforts.",
        cards: [
          { id: "5-1", title: "The Monopoly Board Meeting", type: "Creative Media", scenario: "You are John D. Rockefeller or Andrew Carnegie. You are explaining to your board of directors how you will use horizontal or vertical integration to dominate your industry.", modality: "Corporate Presentation or Pitch Deck", deliverable: "Build a pitch deck as Rockefeller or Carnegie. Beyond explaining horizontal/vertical integration, argue why your strategy was rational business AND address the 'robber baron vs. captain of industry' critique head-on. Use the effect on prices, competitors, and workers as evidence.", standard: "SSUSH11b", dok: "DOK 3", difficulty: "Medium" },
          { id: "5-2", title: "Invention Blueprint Studio", type: "Design / Curation", scenario: "You are an urban planner in 1900. You are writing a master plan on how new inventions are completely reshaping American city infrastructure.", modality: "Annotated Patent & Infrastructure Poster", deliverable: "Design an infrastructure poster on the telegraph, telephone, and electric light. Argue how these technologies did not just improve life but restructured the economy (national markets, new industries, urban density, longer workdays). Rank which had the largest structural impact and defend it.", standard: "SSUSH11c", dok: "DOK 3", difficulty: "Medium" },
          { id: "5-3", title: "Voices from Ellis & Angel Islands", type: "Empathetic Writing", scenario: "You are an immigrant arriving in America in 1905—either a southern European entering through Ellis Island or an Asian immigrant entering through Angel Island.", modality: "Dual-Perspective Letters Home", deliverable: "Write two letters home, one from Ellis Island and one from Angel Island. Use the contrast to argue how U.S. policy treated European and Asian arrivals unequally (Chinese Exclusion, prolonged detention at Angel Island), and analyze how that shaped each group's early experience. Ground both in specific screening realities.", standard: "SSUSH11d", dok: "DOK 3", difficulty: "Hard" },
          { id: "5-4", title: "The Union Strike Manifest", type: "Civics / Law", scenario: "You are a labor organizer working alongside Samuel Gompers in the American Federation of Labor (AFL) in 1895.", modality: "Labor Strike Pamphlet / Manifesto", deliverable: "Write an AFL strike pamphlet. Beyond listing demands, argue why Gompers's 'bread and butter' craft-union strategy was chosen over more radical alternatives, and evaluate its strengths and blind spots (who it excluded). Tie tactics to a specific labor conflict of the era.", standard: "SSUSH11e", dok: "DOK 3", difficulty: "Medium" },
          { id: "5-5", title: "The Transcontinental Railroad Log", type: "Performance / Audio", scenario: "You are a Chinese or Irish laborer working on the grueling construction of the Transcontinental Railroad across the Sierra Nevada mountains.", modality: "Oral History / Audio Log Series", deliverable: "Record a 3-minute oral history as a Chinese or Irish laborer. Beyond hardship, argue how immigrant labor was both essential to and exploited by the railroad, and analyze how completion transformed the West (markets, settlement, displacement of Plains nations). Use specific working conditions as evidence.", standard: "SSUSH12a", dok: "DOK 3", difficulty: "Medium" },
          { id: "5-6", title: "Plains Indians' Resistance Report", type: "Analytical Writing", scenario: "You are an Indigenous historian detailing how westward expansion, farming innovations (barbed wire), and the railroad led to the systematic destruction of the buffalo and Native American displacement.", modality: "Historical Briefing / Research Narrative", deliverable: "Write an analytical brief on how railroads, barbed wire, and the buffalo's destruction enabled displacement. Argue the relationship between economic change and federal policy (reservations, Dawes Act), analyze resistance (Little Bighorn, Wounded Knee), and evaluate why armed resistance ultimately failed. Synthesize multiple causes.", standard: "SSUSH12b, c", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "5-7", title: "Muckraker Exposé", type: "Creative Media", scenario: "You are an investigative muckraker (like Ida Tarbell exposing Standard Oil, or Upton Sinclair investigating Chicago meatpacking plants).", modality: "Investigative Journalism Article", deliverable: "Write a 400-word muckraker exposé. Build an evidence-driven argument for a specific federal reform (e.g., the Pure Food and Drug Act), showing cause and effect from the abuse to the proposed law. Include one anticipated industry counterargument and rebut it.", standard: "SSUSH13a", dok: "DOK 3", difficulty: "Hard" },
          { id: "5-8", title: "The Jim Crow & NAACP Timeline", type: "Analytical / Data", scenario: "You are a civil rights attorney in 1909. You need to show how the supreme court decision in Plessy v. Ferguson directly legalized systemic Jim Crow segregation, prompting the founding of the NAACP.", modality: "Legal Context Map & Infographic", deliverable: "Build a legal-context map from Plessy v. Ferguson to the founding of the NAACP. Argue how a single doctrine ('separate but equal') legitimized an entire system of laws, and evaluate the NAACP's early legal strategy as a response. Trace at least three causal links.", standard: "SSUSH13c", dok: "DOK 3-4", difficulty: "Medium" },
          { id: "5-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Propose a custom project focusing on the labor struggles, industrial titans, or Progressive reforms of this era.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal. It must hit DOK 3 or higher: analysis, argument, or evaluation with specific evidence, not description. Name the standard and the DOK level you are targeting.", standard: "SSUSH11 - SSUSH13", dok: "DOK 3+", difficulty: "Flexible" }
        ]
      },
      {
        id: "domain-6",
        title: "6. Emergence of Modern America & WWI",
        standards: "SSUSH14 - SSUSH16",
        description: "Examine American imperialism, expansion into Latin America, domestic and foreign policy surrounding World War I, and the massive cultural shifts of the 1920s.",
        cards: [
          { id: "6-1", title: "The Imperialism Debate", type: "Analytical Writing", scenario: "The year is 1899. The US has just gained control of the Philippines and Puerto Rico after the Spanish-American War. You are arguing the future of American foreign policy.", modality: "Point-Counterpoint Speeches", deliverable: "Write two opposing speeches on post-1898 expansion. Each must argue from a genuine framework (economic/strategic expansionism vs. anti-imperialist principle and self-determination), citing the Philippines or Puerto Rico. Then add your evaluation of which position better fit America's stated founding ideals.", standard: "SSUSH14a", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "6-2", title: "The Panama Canal Dig Log", type: "Design / Curation", scenario: "You are an engineer working on the construction of the Panama Canal, dealing with mudslides, malaria, and the massive scale of the locks.", modality: "Engineering & Geopolitical Journal", deliverable: "Create an engineering-and-geopolitics journal. Argue how the Roosevelt Corollary and 'big stick' diplomacy made the canal possible, and evaluate the ethical cost of how the U.S. secured the Canal Zone. Connect one engineering challenge to a policy or human consequence.", standard: "SSUSH14b", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-3", title: "Deciphering the Zimmermann Cable", type: "Analytical / Data", scenario: "You are a cryptanalyst in Woodrow Wilson's state department in 1917, analyzing the Zimmermann Telegram and Germany's use of unrestricted submarine warfare.", modality: "Intelligence Briefing & Decoded Report", deliverable: "Write an intelligence briefing arguing that the Zimmermann Telegram plus unrestricted submarine warfare made U.S. neutrality untenable. Analyze how each factor eroded a specific American interest, and evaluate whether entry into WWI was inevitable or a choice. Support the judgment.", standard: "SSUSH15a", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-4", title: "The Great Migration Map", type: "Design / Curation", scenario: "You are an African American family in rural Mississippi in 1917, planning your migration to Chicago or Detroit to find wartime industrial work.", modality: "Migration Journey Map & Oral History", deliverable: "Map a migration from the rural South to a Northern city. Argue the push/pull factors with specificity (Jim Crow violence, sharecropping vs. wartime factory demand), and analyze how the migration reshaped both the North (new communities, competition, culture) and the South. Support with concrete factors.", standard: "SSUSH15b", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-5", title: "Woodrow Wilson's Peace League", type: "Civics / Law", scenario: "You are a US Senator in 1919, debating whether the United States should ratify the Treaty of Versailles and join Woodrow Wilson's League of Nations.", modality: "Congressional Debate Speech", deliverable: "Write a Senate speech for or against ratifying the Treaty of Versailles and joining the League. Argue from a coherent principle (collective security vs. sovereignty and entanglement), engage Wilson's Fourteen Points directly, and evaluate the long-term consequence of the choice the Senate actually made.", standard: "SSUSH15c", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "6-6", title: "The Red Scare Warning", type: "Creative Media", scenario: "You are an investigative journalist covering the Palmer Raids and the rapid passage of strict immigrant quotas in 1920 following the Bolshevik Revolution.", modality: "Exposé Newspaper Article", deliverable: "Write a feature on the first Red Scare and Palmer Raids. Argue how postwar fear translated into concrete restrictions on civil liberties and immigration (quotas), and evaluate whether the government's response was proportionate to the actual threat. Cite specific actions.", standard: "SSUSH16a", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-7", title: "The Assembly Line Revolution", type: "Analytical / Data", scenario: "You are an industrial psychologist hired by Henry Ford in 1924 to analyze the social effects of mass production and modern advertising.", modality: "Analytical Report on Consumerism", deliverable: "Write a report on mass production and advertising. Argue the causal chain from the assembly line to lower prices to a national consumer culture to rising personal debt and installment buying, then evaluate one long-term risk this created that surfaced in 1929. Use specifics.", standard: "SSUSH16c", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-8", title: "The Harlem Renaissance Broadcast", type: "Performance / Audio", scenario: "You are a radio announcer broadcasting live from a jazz club in Harlem in 1926, showcasing the explosion of Black cultural expression.", modality: "Radio Show Podcast Recording", deliverable: "Record a 3-minute broadcast on the Harlem Renaissance. Beyond reviewing artists (Hughes, Armstrong, Ellington), argue how the movement functioned as cultural assertion tied to the Great Migration and the 'New Negro' identity, and analyze how it challenged prevailing racial narratives. Cite one work as evidence.", standard: "SSUSH16e", dok: "DOK 3", difficulty: "Medium" },
          { id: "6-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Design your own custom exploration of WWI domestic policy, 1920s culture, or the fight for suffrage.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan via the Wildcard Portal. It must hit DOK 3 or higher: analysis, argument, or evaluation with specific evidence, not description. Name the standard and the DOK level you are targeting.", standard: "SSUSH14 - SSUSH16", dok: "DOK 3+", difficulty: "Flexible" }
        ]
      },
      {
        id: "domain-7",
        title: "7. Great Depression & World War II",
        standards: "SSUSH17 - SSUSH19",
        description: "Analyze the systemic causes of the Great Depression, FDR's New Deal programs, the global scale of WWII, and the extensive mobilization on the home front.",
        cards: [
          { id: "7-1", title: "The Crash Analysis Chart", type: "Analytical / Data", scenario: "You are an economist in late 1929 analyzing the underlying cracks in the US economy that triggered the Stock Market Crash.", modality: "Economic Breakdown & Diagram", deliverable: "Build a diagram of the causes of the Crash. Argue how overproduction, underconsumption, and speculation interacted (not just coexisted) to make collapse likely, and evaluate which cause was most fundamental. Distinguish the Crash itself from the broader Depression.", standard: "SSUSH17a", dok: "DOK 3", difficulty: "Medium" },
          { id: "7-2", title: "Dust Bowl Diary", type: "Empathetic Writing", scenario: "You are an Oklahoma farmer in 1934 whose land has been ruined by severe drought and decades of over-farming.", modality: "First-Person Narrative / Diary Series", deliverable: "Write a 3-part 'Okie' diary. Beyond hardship, analyze the human and environmental causes (drought plus decades of poor farming practice) and argue how the disaster exposed the limits of unregulated land use. Connect your family's choices to a specific New Deal response (e.g., soil conservation).", standard: "SSUSH17b", dok: "DOK 3", difficulty: "Medium" },
          { id: "7-3", title: "The New Deal Showcase", type: "Creative Media", scenario: "You are a communications director for Franklin D. Roosevelt's administration, preparing a guide to show the public how New Deal programs will help them.", modality: "Fireside Chat Script or Info Guide", deliverable: "Write a Fireside Chat script on the New Deal. Sort programs by relief, recovery, and reform, and argue which category mattered most for restoring public confidence. Address one specific critique (overreach or insufficiency) and answer it in FDR's voice.", standard: "SSUSH18a, b", dok: "DOK 3", difficulty: "Medium" },
          { id: "7-4", title: "The First Lady's Field Brief", type: "Empathetic Writing", scenario: "You are Eleanor Roosevelt traveling across the nation in 1936 to inspect New Deal program effectiveness and advocate for marginalized Americans.", modality: "Eleanor's Field Report to FDR", deliverable: "Write Eleanor Roosevelt's field report to FDR. Argue which groups the New Deal underserved (Black Americans, sharecroppers, women) and analyze why (the political constraints of the Democratic coalition). Recommend two specific policy adjustments and defend their feasibility.", standard: "SSUSH18d", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "7-5", title: "WWII Theater Logistics Board", type: "Design / Curation", scenario: "You are a military logistics coordinator briefing generals on the massive difficulties of supplying weapons, medical supplies, and food across two oceans.", modality: "Logistics Briefing & Supply Map", deliverable: "Build a supply-chain infographic contrasting the Pacific and European theaters. Argue how each theater's geography dictated a distinct strategy (island-hopping vs. cross-Channel buildup), and evaluate which logistical challenge was harder to solve. Support with specific operations.", standard: "SSUSH19b, c", dok: "DOK 3-4", difficulty: "Hard" },
          { id: "7-6", title: "Home Front Mobilization Guide", type: "Creative Media", scenario: "You are a member of the Office of War Information in 1943. Your task is to instruct citizens on how they must contribute to victory from home.", modality: "Wartime Home Front Manual", deliverable: "Design a home-front manual. Beyond describing rationing, bonds, and scrap drives, argue how total-war mobilization permanently changed the roles of women and African Americans in the economy, and evaluate whether those gains held after 1945. Cite Rosie the Riveter and the Double V campaign as evidence.", standard: "SSUSH19d", dok: "DOK 3", difficulty: "Medium" },

                            • Artifact describes, lists, or retells rather than argues.<br />
                            • Claim is missing, or is stated without specific historical evidence.<br />
                            • No evaluation, causal reasoning, or defended position. Send back with a specific push toward analysis.
                          </p>
                        </div>

                        <div className="bg-indigo-950/20 p-4 rounded-xl border border-indigo-500/30">
                          <h4 className="font-bold text-sm text-teal-400 mb-2">Meets Standard (DOK 3 – Target)</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">
                            • <strong>Argument:</strong> Makes a clear claim and defends it.<br />
                            • <strong>Evidence:</strong> Cites specific, accurate historical evidence tied to the target standard.<br />
                            • <strong>Reasoning:</strong> Analyzes cause, consequence, or trade-offs; the role and modality constraints are fully met.
                          </p>
                        </div>

                        <div className="bg-slate-900 p-4 rounded-xl border border-purple-500/30">
                          <h4 className="font-bold text-sm text-purple-400 mb-2">Exceeds Standard (DOK 4 – Extended)</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">
                            • Synthesizes across multiple sources, events, or eras.<br />
                            • Weighs competing interpretations and defends a judgment.<br />
                            • Connects the historical pattern to a broader or modern dynamic with evidence.
                          </p>
                        </div>

                      </div>

                      <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-bold text-sm text-slate-200 mb-2">Implementation Notes for Teachers</h4>
                        <ul className="text-xs text-slate-400 space-y-2 list-disc pl-5">
                          <li>Because every square is DOK 3+, choice varies modality and interest, not rigor. A student cannot lower the demand by picking a "creative" square.</li>
                          <li>Grade the reasoning, not the polish. A rough poster with a defended, evidence-backed argument outscores a beautiful one that only describes.</li>
                          <li>Each card shows its DOK band. Use it to norm expectations before students choose, and to justify scores in conferences.</li>
                          <li>Approve Wildcards only if the pitch states a DOK 3+ target with an analysis or evaluation verb. Reject "make a poster about X" with no argument.</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {getCardsWithWildcards().map((card, i) => (
                        <button
                          key={card.id || i}
                          onClick={() => setSelectedCard(card)}
                          className={`text-left p-5 rounded-xl border transition-all flex flex-col justify-between gap-4 h-64 relative group ${
                            card.id.includes('wildcard') || card.id.includes('ai')
                              ? "bg-slate-950 border-dashed border-indigo-500/50 hover:border-indigo-400"
                              : "bg-slate-950 hover:bg-slate-900 border-slate-800 hover:border-slate-700"
                          } ${selectedCard?.id === card.id ? "ring-2 ring-teal-500 border-transparent" : ""}`}
                        >
                          <div>
                            <div className="flex items-center justify-between gap-2 mb-2">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                                  card.id.includes('wildcard') || card.id.includes('ai')
                                    ? "bg-indigo-500/10 text-indigo-300"
                                    : "bg-teal-500/10 text-teal-300"
                                }`}>
                                  {card.type}
                                </span>
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${dokBadgeClass(card.dok)}`}>
                                  {card.dok}
                                </span>
                              </div>
                              <span className="font-mono text-[9px] text-slate-500">{card.standard}</span>
                            </div>

                            <h4 className="font-bold text-sm text-slate-100 group-hover:text-teal-300 transition-colors line-clamp-1">
                              {card.title}
                            </h4>

                            <p className="text-xs text-slate-400 mt-2 line-clamp-4 leading-relaxed">
                              {card.scenario}
                            </p>
                          </div>

                          <div className="border-t border-slate-900 pt-3 flex items-center justify-between w-full mt-auto">
                            <span className="text-[10px] text-slate-500 font-mono">Modality: {card.modality.split(' ')[0]}...</span>
                            <span className="text-[10px] text-teal-400 group-hover:translate-x-1 transition-transform flex items-center gap-1">
                              Inspect <ChevronRight className="h-3 w-3" />
                            </span>
                          </div>
                        </button>
                      ))}
                    </div>

                    {getFilteredCards().length === 0 && (
                      <div className="bg-slate-950 p-12 text-center rounded-xl border border-slate-800">
                        <HelpCircle className="h-10 w-10 text-slate-600 mx-auto mb-3" />
                        <p className="text-slate-400 text-sm">No tasks matched your filter query. Resetting search bar...</p>
                        <button
                          onClick={() => setSearchQuery("")}
                          className="mt-3 px-4 py-1.5 bg-slate-850 hover:bg-slate-800 text-xs rounded-lg text-slate-300 border border-slate-800"
                        >
                          Clear Filter
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {selectedCard && (
                  <div className="bg-gradient-to-br from-slate-950 to-slate-900 rounded-xl p-6 border border-teal-500/30 shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-3">
                      <button
                        onClick={() => setSelectedCard(null)}
                        className="text-slate-400 hover:text-white text-xs bg-slate-850 hover:bg-slate-800 px-2.5 py-1 rounded"
                      >
                        Close Inspection
                      </button>
                    </div>

                    <div className="max-w-2xl">
                      <div className="flex items-center gap-2 mb-2 flex-wrap">
                        <span className="bg-teal-500/10 text-teal-400 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                          {selectedCard.type}
                        </span>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${dokBadgeClass(selectedCard.dok)}`}>
                          {selectedCard.dok}
                        </span>
                        <span className="font-mono text-xs text-slate-400">Standard Match: {selectedCard.standard}</span>
                        <span className="text-xs text-slate-500">• Difficulty: {selectedCard.difficulty}</span>
                      </div>

                      <h3 className="text-2xl font-black text-white mb-4 tracking-tight">{selectedCard.title}</h3>

                      <div className="space-y-4">
                        <div>
                          <h5 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Real-World Scenario</h5>
                          <p className="text-sm text-slate-300 mt-1 leading-relaxed bg-slate-950/50 p-3 rounded-lg border border-slate-900">
                            {selectedCard.scenario}
                          </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div className="bg-slate-950/30 p-3 rounded-lg border border-slate-850">
                            <h5 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Suggested Modality</h5>
                            <p className="text-sm text-teal-300 font-semibold mt-1">{selectedCard.modality}</p>
                          </div>
                          <div className="bg-slate-950/30 p-3 rounded-lg border border-slate-850">
                            <h5 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Required Deliverable</h5>
                            <p className="text-sm text-indigo-300 font-semibold mt-1">{selectedCard.deliverable}</p>
                          </div>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-3 mt-6 pt-5 border-t border-slate-800/80">
                        <button
                          onClick={() => handleCopyToClipboard(`Task: ${selectedCard.title}\nType: ${selectedCard.type} (${selectedCard.dok})\nScenario: ${selectedCard.scenario}\nModality: ${selectedCard.modality}\nDeliverable: ${selectedCard.deliverable}\nStandard: ${selectedCard.standard}`)}
                          className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-lg border border-slate-700 transition-colors"
                        >
                          <Copy className="h-3.5 w-3.5" /> Copy Task Text
                        </button>
                        <button
                          onClick={() => { window.print(); }}
                          className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-all"
                        >
                          <Share2 className="h-3.5 w-3.5" /> Share / Print Project Card
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6">
                  <div className="flex items-center gap-2 mb-3">
                    <Sparkles className="h-5 w-5 text-indigo-400" />
                    <h3 className="font-bold text-base text-white">Student Wildcard Submission</h3>
                  </div>
                  <p className="text-xs text-slate-400 mb-5 leading-relaxed">
                    Students pitch their own project here. To be approved and injected into the grid, the pitch must target DOK 3 or higher: the deliverable has to require an argument, analysis, or evaluation backed by specific evidence, not a description.
                  </p>

                  {wildcardSuccess && (
                    <div className="bg-emerald-950/30 border border-emerald-500/30 text-emerald-300 text-xs p-3 rounded-lg mb-4 flex items-center gap-2">
                      <CheckCircle className="h-4 w-4" /> Wildcard accepted and injected into the current choice grid.
                    </div>
                  )}

                  <div className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="md:col-span-1">
                        <label className="block text-xs font-bold text-slate-400 mb-1">Project Title</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Reconstruction on Trial"
                          value={customProposal.title}
                          onChange={(e) => setCustomProposal({...customProposal, title: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Standard Focus</label>
                        <input
                          type="text"
                          placeholder={currentDomain.standards}
                          value={customProposal.standard || currentDomain.standards}
                          onChange={(e) => setCustomProposal({...customProposal, standard: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">DOK Target</label>
                        <select
                          value={customProposal.dok}
                          onChange={(e) => setCustomProposal({...customProposal, dok: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                        >
                          <option value="DOK 3">DOK 3 (argue with evidence)</option>
                          <option value="DOK 3-4">DOK 3-4</option>
                          <option value="DOK 4">DOK 4 (synthesize/evaluate)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Your Real-World Role / Scenario</label>
                        <textarea
                          rows="2"
                          placeholder="e.g. I am a political strategist advising..."
                          value={customProposal.scenario}
                          onChange={(e) => setCustomProposal({...customProposal, scenario: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Required Deliverable (must argue or evaluate)</label>
                        <textarea
                          rows="2"
                          required
                          placeholder="e.g. Argue whether... and defend with evidence from..."
                          value={customProposal.deliverable}
                          onChange={(e) => setCustomProposal({...customProposal, deliverable: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end pt-2">
                      <button
                        type="button"
                        onClick={handleWildcardSubmit}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-lg transition-all shadow-md shadow-indigo-600/10"
                      >
                        Accept Wildcard Project
                      </button>
                    </div>
                  </div>
                </div>

              </div>

            </div>

          </main>

          <div className="hidden print:block bg-white text-slate-950 p-8 min-h-screen">
            <div className="border-b border-slate-300 pb-4 mb-6">
              <h1 className="text-2xl font-extrabold tracking-tight">USH Choice Board Studio</h1>
              <p className="text-xs text-slate-500">Georgia Standards of Excellence (GSE) • Every task DOK 3+</p>
              <div className="text-sm font-bold text-slate-950 mt-2">
                Selected Unit: {currentDomain.title} ({currentDomain.standards})
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3">
              {getCardsWithWildcards().map((card, i) => (
                <div key={card.id || i} className="border border-slate-400 p-4 rounded-lg flex flex-col justify-between h-[240px]">
                  <div>
                    <div className="text-[10px] font-bold uppercase text-slate-500 flex justify-between">
                      <span>{card.type} • {card.dok}</span>
                      <span>{card.standard}</span>
                    </div>
                    <h4 className="font-extrabold text-sm mt-1 border-b border-slate-200 pb-1">{card.title}</h4>
                    <p className="text-xs text-slate-700 mt-2 leading-tight">{card.scenario}</p>
                  </div>
                  <div className="border-t border-slate-200 pt-2 text-[10px] text-slate-950 font-semibold">
                    <div>Deliverable: {card.deliverable}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-8 border-t border-slate-300 pt-4">
              <h3 className="text-sm font-bold">Directions for Students:</h3>
              <p className="text-xs text-slate-600 mt-1">
                Choose exactly one (1) task from the board above to complete as your unit assessment. Every task is DOK 3 or higher, so no matter which modality you pick, you must make a claim and defend it with specific historical evidence. Your work is graded on the depth of your reasoning and use of evidence, not on decoration.
              </p>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
