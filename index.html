        cards: [

          { id: "9-9", title: "Wildcard: Your History, Your Voice", type: "Student Choice", scenario: "Propose a custom project covering the Clinton Impeachment, environmental policy shifts, or another defining modern event.", modality: "Custom Project Proposal", deliverable: "Pitch a custom plan using our Wildcard portal to explore any aspect of Nixon-to-Obama era developments.", standard: "SSUSH22 - SSUSH23", difficulty: "Flexible" }

    function App() {
      const [selectedDomainIndex, setSelectedDomainIndex] = useState(0);
      const [selectedCard, setSelectedCard] = useState(null);
      const [wildcards, setWildcards] = useState([]);

        title: "",

      const [searchQuery, setSearchQuery] = useState("");

      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState("");

      const getFilteredCards = () => {
        if (!searchQuery) return currentDomain.cards;
        return currentDomain.cards.filter(card =>
          card.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          card.scenario.toLowerCase().includes(searchQuery.toLowerCase()) ||
          card.deliverable.toLowerCase().includes(searchQuery.toLowerCase()) ||
          card.standard.toLowerCase().includes(searchQuery.toLowerCase())

      const handleWildcardSubmit = (e) => {
        e.preventDefault();
        if (!customProposal.title || !customProposal.deliverable) return;

        const newWildcard = {
          ...customProposal,
          id: `wildcard-${Date.now()}`,
          type: "Student Choice (Custom)",
          difficulty: "Flexible",
          domainId: currentDomain.id

        setWildcards([...wildcards, newWildcard]);
        setWildcardSuccess(true);

        setCustomProposal({
          title: "",
          scenario: "",
          modality: "",
          deliverable: "",
          standard: currentDomain.standards
        });

        setTimeout(() => setWildcardSuccess(false), 4000);
      };

      const getCardsWithWildcards = () => {
        const baseCards = [...currentDomain.cards];
        const domainWildcards = wildcards.filter(w => w.domainId === currentDomain.id);
        if (domainWildcards.length > 0) {
          baseCards[8] = domainWildcards[domainWildcards.length - 1];
        }
        return baseCards;
      };

      // Custom task generator (local template mode; no external API key configured).
      const generateAICustomCard = async () => {
        if (!aiCustomPrompt) return;
        setAiLoading(true);
        setAiError("");

        const apiKey = ""; // No key configured -> local generation
        if (!apiKey) {
          setTimeout(() => {
            const localCustom = {
              id: `ai-${Date.now()}`,
              title: `Custom Project: ${aiCustomPrompt.substring(0, 25)}...`,
              type: "AI Assisted Idea",
              scenario: `Based on your request: "${aiCustomPrompt}". You are taking on a professional role to address historical challenges.`,
              modality: "Digital presentation, podcast, or visual exhibit",
              deliverable: "Create a comprehensive demonstration of learning that addresses Georgia Standards of Excellence, highlighting primary sources.",
              standard: currentDomain.standards,
              difficulty: "Medium",
              domainId: currentDomain.id
            };
            setWildcards(prev => [...prev, localCustom]);
            setAiLoading(false);
            setAiCustomPrompt("");
            setWildcardSuccess(true);
            setTimeout(() => setWildcardSuccess(false), 4000);
          }, 1000);
          return;
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const handleCopyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Copy failed', err);
        }
        document.body.removeChild(textArea);
      };

        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-teal-500 selection:text-slate-900">

          {/* Top Premium Brand Header */}

            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">

                            • <strong>Communication:</strong> High-quality delivery of chosen modality (clear audio, solid design, or strong writing).

                            • Exceptional creativity or design execution.<br />
                            • Connects historical patterns directly to modern global dynamics.

                        <ul className="text-xs text-slate-400 space-y-2 list-disc pl-5">

                          } ${selectedCard?.id === card.id ? "ring-2 ring-teal-500 border-transparent" : ""}`}
                        >

                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Your Real-World Role / Scenario</label>
                        <textarea
                          rows="2"
                          placeholder="e.g. I am taking on the role of a political strategist advising..."
                          value={customProposal.scenario}
                          onChange={(e) => setCustomProposal({...customProposal, scenario: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Required Deliverable</label>
                        <textarea
                          rows="2"
                          required
                          placeholder="e.g. A digital flowchart showcasing legislative connections or..."
                          value={customProposal.deliverable}
                          onChange={(e) => setCustomProposal({...customProposal, deliverable: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end pt-2">
                      <button
                        type="button"
                        onClick={handleWildcardSubmit}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-lg transition-all shadow-md shadow-indigo-600/10"
                      >
                        Accept Wildcard Project
                      </button>
                    </div>
                  </div>
                </div>

              </div>

            </div>

          </main>

          {/* Printable Grid Sheet (visible only when printing) */}
          <div className="hidden print:block bg-white text-slate-950 p-8 min-h-screen">
            <div className="border-b border-slate-300 pb-4 mb-6">
              <h1 className="text-2xl font-extrabold tracking-tight">USH Choice Board Studio</h1>
              <p className="text-xs text-slate-500">Georgia Standards of Excellence (GSE) Assessment Tool</p>
              <div className="text-sm font-bold text-slate-950 mt-2">
                Selected Unit: {currentDomain.title} ({currentDomain.standards})
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3">
              {getCardsWithWildcards().map((card, i) => (
                <div key={card.id || i} className="border border-slate-400 p-4 rounded-lg flex flex-col justify-between h-[240px]">
                  <div>
                    <div className="text-[10px] font-bold uppercase text-slate-500 flex justify-between">
                      <span>{card.type}</span>
                      <span>{card.standard}</span>
                    </div>
                    <h4 className="font-extrabold text-sm mt-1 border-b border-slate-200 pb-1">{card.title}</h4>
                    <p className="text-xs text-slate-700 mt-2 leading-tight">{card.scenario}</p>
                  </div>
                  <div className="border-t border-slate-200 pt-2 text-[10px] text-slate-950 font-semibold">
                    <div>Deliverable: {card.deliverable}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-8 border-t border-slate-300 pt-4">
              <h3 className="text-sm font-bold">Directions for Students:</h3>
              <p className="text-xs text-slate-600 mt-1">
                Choose exactly one (1) authentic learning task from the choice board above to complete as your unit assessment. Your chosen deliverable will be evaluated using the official course rubrics focusing on historical accuracy, alignment to standard, and production value.
              </p>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
